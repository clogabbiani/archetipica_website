<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Note Legali — Archetipica</title>
    <meta name="robots" content="noindex, nofollow">

    <!-- Cookie consent LegalBlink (Aruba) -->
    <script type="text/javascript" src="https://app.legalblink.it/api/scripts/lb_cs.js"></script>
    <script id="lb_cs" type="text/javascript">lb_cs("69cb840a551cc000213ad6ee");</script>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="fonts/fonts.css">
    <link rel="icon" type="image/png" href="materialesito/Soft Fluid Design Logo for Beauty Brand.png">

    <style>
        .legal-hero {
            background: var(--burgundy-dark);
            padding: 7rem 0 3rem;
            text-align: center;
        }
        .legal-hero h1 {
            font-family: var(--font-serif);
            font-size: 2.5rem;
            color: var(--rose);
            margin-bottom: 0.5rem;
        }
        .legal-hero p {
            font-family: var(--font-sans);
            font-size: 0.9rem;
            color: rgba(255,255,255,0.5);
        }
        .legal-nav {
            background: var(--cream);
            border-bottom: 1px solid var(--rose);
            padding: 1rem 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .legal-nav ul {
            list-style: none;
            display: flex;
            justify-content: center;
            gap: 2rem;
            flex-wrap: wrap;
            padding: 0 1rem;
        }
        .legal-nav a {
            font-family: var(--font-sans);
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--burgundy);
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: color 0.2s;
        }
        .legal-nav a:hover { color: var(--gold); }
        .legal-section {
            padding: 4rem 0;
            border-bottom: 1px solid var(--rose);
        }
        .legal-section:last-of-type { border-bottom: none; }
        .legal-section h2 {
            font-family: var(--font-serif);
            font-size: 1.8rem;
            color: var(--burgundy-dark);
            margin-bottom: 1.5rem;
        }
        .legal-frame {
            border: 1px solid var(--rose);
            border-radius: 8px;
            overflow: hidden;
        }
        .legal-frame iframe {
            border: none;
            width: 100%;
            height: 600px;
            display: block;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 2rem;
            font-family: var(--font-sans);
            font-size: 0.85rem;
            color: var(--burgundy);
            text-decoration: none;
        }
        .back-link:hover { color: var(--gold); }
    </style>
</head>
<body>

    <div class="legal-hero">
        <h1>Note Legali</h1>
        <p>Archetipica — Lucrezia</p>
    </div>

    <nav class="legal-nav">
        <ul>
            <li><a href="#cookie-policy">Cookie Policy</a></li>
            <li><a href="#condizioni-uso">Condizioni d'uso</a></li>
            <li><a href="index.html">← Torna al sito</a></li>
        </ul>
    </nav>

    <main class="container" style="max-width: 900px; padding-top: 3rem; padding-bottom: 3rem;">

        <!-- Cookie Policy -->
        <section class="legal-section" id="cookie-policy">
            <h2>Cookie Policy</h2>
            <div class="legal-frame">
                <iframe src="https://app.legalblink.it/api/documents/69cb840a551cc000213ad6e8/cookie-policy-it"
                        title="Cookie Policy"
                        loading="lazy"></iframe>
            </div>
        </section>

        <!-- Condizioni d'uso -->
        <section class="legal-section" id="condizioni-uso">
            <h2>Condizioni d'uso del sito</h2>
            <div class="legal-frame">
                <iframe src="https://app.legalblink.it/api/documents/69cb840a551cc000213ad6e8/condizioni-d'uso-del-sito-it"
                        title="Condizioni d'uso del sito"
                        loading="lazy"></iframe>
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <p class="footer-text">Con amore e sacralità</p>
                <p class="footer-signature">— Archetipica</p>
            </div>
            <div class="footer-bottom">
                <p class="footer-piva">P.IVA: IT0000000000000000001</p>
                <p>&copy; Copyright 2026 | Archetipica Sub | All Rights Reserved</p>
            </div>
        </div>
    </footer>

</body>
</html>
